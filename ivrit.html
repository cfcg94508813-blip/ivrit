<ul class="gr">

<li><b>Слова на ${hw('ה')} (-е):</b> в обоих родах пишутся одинаково, меняется только чтение: ${hw('רוֹצֶה')} — роце (м.р.), ${hw('רוֹצָה')} — роца (ж.р.). Так же ${hw('שותה')} (шоте / шота), ${hw('עושה')} (осе / оса), ${hw('מורה')} (море / мора). Без огласовок род виден только по контексту: ${hw('הוא רוצה','hу роце')}, ${hw('היא רוצה','hи роца')}.</li>

</ul>

const VEXP=`<p>В настоящем времени у глагола 4 формы: по роду и числу. Лицо не важно: ${hw('אני')}, ${hw('אתה')} и ${hw('הוא')} — все ${hw('לומד','ломед')}.</p>
